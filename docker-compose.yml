services:
  postgres:
    image: postgres:18-alpine
    container_name: shopkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shopkeeper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shopkeeper}
      POSTGRES_DB: ${DB_NAME:-shopkeeper}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shopkeeper} -d ${DB_NAME:-shopkeeper}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-test:
    image: postgres:18-alpine
    container_name: shopkeeper-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: shopkeeper
      POSTGRES_PASSWORD: shopkeeper
      POSTGRES_DB: shopkeeper_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkeeper -d shopkeeper_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    env_file: .env
    environment:
      DB_HOST: postgres
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopkeeper-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
