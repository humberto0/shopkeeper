name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a running job when new commits are pushed to the same branch —
# there is no point in testing a commit that is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIGRATE_VERSION: v4.18.1

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: make govulncheck

  test:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shopkeeper
          POSTGRES_PASSWORD: shopkeeper
          POSTGRES_DB: shopkeeper_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shopkeeper -d shopkeeper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://shopkeeper:shopkeeper@localhost:5433/shopkeeper_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned: @latest would let an upstream release break CI on a commit
      # that changed nothing.
      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@${{ env.MIGRATE_VERSION }}

      - name: Run migrations
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test with coverage threshold
        run: make test-coverage-check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out