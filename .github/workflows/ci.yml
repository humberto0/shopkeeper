name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make govulncheck

  test:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shopkeeper
          POSTGRES_PASSWORD: shopkeeper
          POSTGRES_DB: shopkeeper_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shopkeeper -d shopkeeper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://shopkeeper:shopkeeper@localhost:5433/shopkeeper_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test with coverage threshold
        run: make test-coverage-check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
