pre-commit:
  parallel: true
  commands:
    fmt:
      run: gofmt -l -w {staged_files}
      glob: "*.go"
      stage_fixed: true
    lint:
      run: make lint

pre-push:
  parallel: true
  commands:
    test:
      run: make test
    typecheck:
      run: make typecheck
    govulncheck:
      run: make govulncheck