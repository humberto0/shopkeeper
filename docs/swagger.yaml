basePath: /
definitions:
  handler.editUserRequest:
    properties:
      email:
        example: humberto@shop.com
        type: string
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
      version:
        example: 1
        type: integer
    type: object
  handler.editUserResponse:
    properties:
      email:
        example: humberto@shop.com
        type: string
      id:
        example: 018f1d3a-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
      version:
        example: 1
        type: integer
    type: object
  handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  handler.findUserResponse:
    properties:
      createdAt:
        example: "2020-01-01T00:00:00Z"
        type: string
      email:
        example: humbertotest@shop.com
        type: string
      id:
        example: 018f1d3a-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
      isActive:
        example: true
        type: boolean
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
      updatedAt:
        example: "2020-01-01T00:00:00Z"
        type: string
      version:
        example: 1
        type: integer
    type: object
  handler.listUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.findUserResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      totalItems:
        example: 57
        type: integer
      totalPages:
        example: 3
        type: integer
    type: object
  handler.registerUserRequest:
    properties:
      email:
        example: humbertotest@shop.com
        type: string
      name:
        example: Humberto test
        type: string
      password:
        example: senha1234
        type: string
      role:
        enum:
        - owner
        - clerk
        example: owner
        type: string
    type: object
  handler.registerUserResponse:
    properties:
      email:
        example: humbertotest@shop.com
        type: string
      id:
        example: 018f1d3a-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
    type: object
info:
  contact:
    name: Humberto
    url: https://github.com/humberto0/shopkeeper
  description: Stock and sales management API for local shop owners.
  license:
    name: MIT
    url: https://github.com/humberto0/shopkeeper/blob/main/LICENSE
  title: shopkeeper API
  version: "1.0"
paths:
  /health:
    get:
      description: Pings the database pool to check that the API and its dependencies
        are up.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: database unavailable
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /users:
    get:
      description: 'Lists users newest first, paginated by page number. Out-of-range
        values are normalized: page < 1 becomes 1, limit defaults to 20 and is capped
        at 100. A page past the last one returns an empty items array.'
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listUsersResponse'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user account (owner or clerk).
      parameters:
      - description: User to register
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.registerUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.registerUserResponse'
        "400":
          description: malformed request body
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: email already exists
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: invalid name, email, password or role
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Register a new user
      tags:
      - users
  /users/{id}:
    get:
      description: Find user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.findUserResponse'
        "400":
          description: malformed id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Find User
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Edit user account (owner or clerk). Version must match the current
        stored version (optimistic locking).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.editUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.editUserResponse'
        "400":
          description: malformed request body or invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: email already exists
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: invalid name, email, role, or stale version
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Edit an existing user
      tags:
      - users
schemes:
- http
swagger: "2.0"
