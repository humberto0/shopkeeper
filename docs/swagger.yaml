basePath: /
definitions:
  platformhttp.ErrorResponse:
    properties:
      code:
        example: user.not_found
        type: string
      error:
        example: 'user: not found'
        type: string
      requestId:
        example: 0199d4a1-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
    type: object
  platformhttp.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  userhttp.editUserRequest:
    properties:
      email:
        example: humberto@shop.com
        type: string
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
      version:
        example: 1
        type: integer
    type: object
  userhttp.editUserResponse:
    properties:
      email:
        example: humberto@shop.com
        type: string
      id:
        example: 018f1d3a-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
      version:
        example: 1
        type: integer
    type: object
  userhttp.findUserResponse:
    properties:
      createdAt:
        example: "2020-01-01T00:00:00Z"
        type: string
      email:
        example: humbertotest@shop.com
        type: string
      id:
        example: 018f1d3a-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
      isActive:
        example: true
        type: boolean
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
      updatedAt:
        example: "2020-01-01T00:00:00Z"
        type: string
      version:
        example: 1
        type: integer
    type: object
  userhttp.listUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/userhttp.findUserResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      totalItems:
        example: 57
        type: integer
      totalPages:
        example: 3
        type: integer
    type: object
  userhttp.registerUserRequest:
    properties:
      email:
        example: humbertotest@shop.com
        type: string
      name:
        example: Humberto test
        type: string
      password:
        example: senha1234
        type: string
      role:
        enum:
        - owner
        - clerk
        example: owner
        type: string
    type: object
  userhttp.registerUserResponse:
    properties:
      email:
        example: humbertotest@shop.com
        type: string
      id:
        example: 018f1d3a-7c3e-7c3e-8b3e-7c3e7c3e7c3e
        type: string
      name:
        example: Humberto test
        type: string
      role:
        example: owner
        type: string
    type: object
info:
  contact:
    name: Humberto
    url: https://github.com/humberto0/shopkeeper
  description: Stock and sales management API for local shop owners.
  license:
    name: MIT
    url: https://github.com/humberto0/shopkeeper/blob/main/LICENSE
  title: shopkeeper API
  version: "1.0"
paths:
  /health/live:
    get:
      description: Reports that the process is up. It checks no dependencies, so a
        database outage never makes an orchestrator restart the API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformhttp.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Pings the database pool (2 s timeout). Answers 503 while the database
        is unreachable, so traffic stops being routed to this instance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platformhttp.HealthResponse'
        "503":
          description: 'code: health.database_unavailable'
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
      summary: Readiness probe
      tags:
      - health
  /users:
    get:
      description: 'Lists users newest first, paginated by page number. Out-of-range
        values are normalized: page < 1 becomes 1, limit defaults to 20 and is capped
        at 100. A page past the last one returns an empty items array.'
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userhttp.listUsersResponse'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user account (owner or clerk).
      parameters:
      - description: User to register
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userhttp.registerUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/userhttp.registerUserResponse'
        "400":
          description: malformed request body
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
        "409":
          description: email already exists
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
        "422":
          description: invalid name, email, password or role
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
      summary: Register a new user
      tags:
      - users
  /users/{id}:
    get:
      description: Find user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userhttp.findUserResponse'
        "400":
          description: malformed id
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
      summary: Find User
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Edit user account (owner or clerk). Version must match the current
        stored version (optimistic locking).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userhttp.editUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userhttp.editUserResponse'
        "400":
          description: malformed request body or invalid id
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
        "409":
          description: email already exists or stale version
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
        "422":
          description: invalid name, email or role
          schema:
            $ref: '#/definitions/platformhttp.ErrorResponse'
      summary: Edit an existing user
      tags:
      - users
schemes:
- http
swagger: "2.0"
